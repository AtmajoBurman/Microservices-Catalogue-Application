# ── Booking Service Configuration ────────────────────────────────────────────
server.port=8081

# Application name
spring.application.name=booking-service

# Pretty-print JSON
spring.jackson.serialization.indent-output=true

# URL of the Catalogue Service.
# For local development this defaults to localhost:8080.
# Inside Docker this is overridden by the CATALOGUE_SERVICE_URL environment variable
# set in docker-compose.yml (using the Docker service name as hostname).
catalogue.service.url=${CATALOGUE_SERVICE_URL:http://localhost:8080}
